[project]
name = "mergescope-ai"
version = "0.3.0"
description = "Docker-free AI pull-request review workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "fastapi>=0.116.0,<1",
  "httpx[socks]>=0.28.0,<1",
  "langgraph>=1.0.0,<2",
  "openai>=2.0.0,<3",
  "pyjwt[crypto]>=2.10.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
